name: Q-Flow CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Verification & Business Logic Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Server Dependencies
      run: |
        cd server
        npm install

    - name: Run Backend & Business Logic Test Suite
      run: |
        node server/tests/api.test.js

    - name: Install Client Dependencies & Build
      run: |
        cd client
        npm install
        npm run build
